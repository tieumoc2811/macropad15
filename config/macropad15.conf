# Cau hinh Macropad15 - Pro Micro RP2040 (chi USB, khong co Bluetooth)

# ZMK Studio: sua keymap truc tiep tren https://zmk.studio (can snippet studio-rpc-usb-uart trong build.yaml)
CONFIG_ZMK_STUDIO=y

# Cho phep luu thay doi keymap tu Studio vao flash
CONFIG_SETTINGS=y

# Encoder EC11 (da bat mac dinh trong Kconfig.defconfig cua shield, ghi lai o day cho ro rang)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
